name: clinica

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: clinica-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQLSERVER_PASSWORD:-YourSecurePasswordHere!}

    ports:
      - "${SQLSERVER_PORT:-1433}:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SQLSERVER_PASSWORD:-YourSecurePasswordHere!}' -C -Q 'SELECT 1' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clinica-api
    restart: unless-stopped
    ports:
      - "5011:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RunSeeds=${RUN_SEEDS:-true}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ClinicaDb;User Id=sa;Password=${SQLSERVER_PASSWORD:-YourSecurePasswordHere!};TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clinica-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5011
    depends_on:
      - api

volumes:
  sqlserver_data:

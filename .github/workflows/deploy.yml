name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      APP_DIR: /opt/infraestructura/clinica
      SSH_PORT: 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || env.SSH_PORT }}
          source: "."
          target: ${{ secrets.VPS_APP_PATH || env.APP_DIR }}
          overwrite: true
          rm: false

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || env.SSH_PORT }}
          script_stop: true
          script: |
            set -e

            APP_DIR="${{ secrets.VPS_APP_PATH || env.APP_DIR }}"

            echo "Directorio de despliegue: $APP_DIR"

            cd "$APP_DIR"

            echo "Archivos copiados:"
            ls -lah

            # SCP con rm:false no borra archivos eliminados del repo.
            # Limpiar restos (p. ej. componentes TS viejos) sin tocar docker/.env (gitignored).
            if git rev-parse --is-inside-work-tree > /dev/null 2>&1; then
              echo ">> sincronizar working tree con el commit desplegado"
              git reset --hard HEAD
              git clean -fd
            fi

            chmod +x docker/deploy.sh

            export SKIP_GIT_PULL=1
            ./docker/deploy.sh